      // Valida el IBAN (mod 97) en cualquier input name="iban"; vacío se permite
      $.validator.addMethod('ibanvalid', function (value, element) {
        var iban = String(value).toUpperCase().replace(/\s+/g, '');
        if (iban === '') return true;
        if (!/^[A-Z]{2}\d{2}[A-Z0-9]{11,30}$/.test(iban)) return false;
        var rearranged = iban.slice(4) + iban.slice(0, 4);
        var remainder = 0;
        for (var i = 0; i < rearranged.length; i++) {
          var ch = rearranged.charAt(i);
          var digits = /[A-Z]/.test(ch) ? String(ch.charCodeAt(0) - 55) : ch;
          for (var j = 0; j < digits.length; j++) {
            remainder = (remainder * 10 + parseInt(digits.charAt(j), 10)) % 97;
          }
        }
        return remainder === 1;
      }, 'IBAN no válido');

      <script>
         // polyfill for serialize object function.
        $.fn.serializeObject = function()
        {
            var o = {};
            var a = this.serializeArray();
            $.each(a, function() {
                if (o[this.name]) {
                    if (!o[this.name].push) {
                        o[this.name] = [o[this.name]];
                    }
                    o[this.name].push(this.value || '');
                } else {
                    o[this.name] = this.value || '';
                }
            });
            return o;
        };
        </script>
<script type="text/javascript">

  function activedropzone(form){

     var formelement = $('#'+form);
    formmethod = formelement.attr('method');
    formurl = formelement.attr('action');
    

    Dropzone.autoDiscover = false;
    myDropzone=new Dropzone("#edit",{
          clickable: ".dropzone",
          paramName: "file", 
          url: formurl,
          previewsContainer: "#previewsContainer",
          uploadMultiple: false,
          autoProcessQueue: false,

          init() {
            var myDropzone = this;
            this.element.querySelector("[type=submit]").addEventListener("click", function(e){
              e.preventDefault();
              e.stopPropagation();
              // get form element from event
              var formelement = $(e.target).closest('form')[0].id;
              $("#"+formelement).validate();
              if ($("#"+formelement).valid() == true) { 
                if (myDropzone.getQueuedFiles().length > 0) {    
                  console.log('files to upload');
                  myDropzone.processQueue();  
                } else {      
                  console.log('no files to upload');
                  $("#"+formelement).submit();
                }                                    
              }          
            });
          }
        });
        myDropzone.on("queuecomplete", function(file) {
          window.location.reload();
        });


  }

</script>
