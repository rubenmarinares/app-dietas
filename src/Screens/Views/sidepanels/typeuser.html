
<h5 class="card-title mb-3">Tipo de Usuario
  <button type="button" class="btn-close float-end" data-bs-dismiss="offcanvas" aria-label="Close"></button>
</h5>

    <form id="edit" action="{{APP_PATH}}settings/typeuser/{{item.idtypeuser}}" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="row">
        <div class="mb-3 col-md-12">
          <label class="form-label">Tipo de Usuario</label>
          <input type="text" class="form-control required" name="typeuser" value="{{item.typeuser}}">
        </div>

        <div class="mb-3 col-md-12">
          <label class="form-label">Permisos (JSON: módulo &rarr; none | read | write)</label>
          <textarea class="form-control" name="permissions" rows="4" placeholder='{"*": "read"}'>{% if item.permissions is iterable %}{{item.permissions|json_encode}}{% endif %}</textarea>
          <small class="text-muted">Vacío = acceso total. Solo lectura (gestoría): {"*": "read"}</small>
        </div>

        <div class="mt-3 col-md-6">
          {% if can() %}
          <button class="btn btn-primary" type="submit"><i class="fa-regular fa-square-check"></i>&nbsp;Guardar</button>
          {% endif %}
        </div>
        <div class="mt-3 col-md-6">
          {{print_checkeliminar()|raw}}
        </div>
      </div>
    </form>
