
<h5 class="card-title mb-3">Usuario
  <button type="button" class="btn-close float-end" data-bs-dismiss="offcanvas" aria-label="Close"></button>
</h5>

    <form id="edit" action="{{APP_PATH}}settings/user/{{item.iduser}}" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="row">
        <div class="mb-2 col-md-6">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control required" name="name" value="{{item.name}}">
        </div>
        <div class="mb-2 col-md-6">
          <label class="form-label">Apellidos</label>
          <input type="text" class="form-control required" name="surname" value="{{item.surname}}">
        </div>
        <div class="mb-2 col-md-6">
          <label class="form-label">Email</label>
          <input type="email" class="form-control required" name="email" value="{{item.email}}">
        </div>
        <div class="mb-2 col-md-6">
          <label class="form-label">Nueva contraseña</label>
          <input type="password" class="form-control" name="newpassword" value="">
        </div>
        <div class="mb-2 col-md-6"> 
          <label class="form-label">Tipo de usuario</label>          
          <select class="form-select " id="typeuserid"  name="typeuserid"  >
          {% for idlabel in combos.typeuserid %}
          <option value="{{ idlabel.id }}" {% if idlabel.id == item.typeuserid %}selected="selected"{% endif %}>{{ idlabel.label }}</option>
          {% endfor %}
          </select>
        </div>
        <div class="mb-2 col-md-6"> 
          <label class="form-label">Activo</label>          
          <select class="form-select " id="status"  name="status"  >
          {% for idlabel in combos.status %}
          <option value="{{ idlabel.id }}" {% if idlabel.id == item.status %}selected="selected"{% endif %}>{{ idlabel.label }}</option>
          {% endfor %}
          </select>
        </div>

        <div class="mt-3 col-md-6">
          {% if can() %}
          <button class="btn btn-primary" type="submit"><i class="fa-regular fa-square-check"></i>&nbsp;Guardar</button>
          {% endif %}
        </div>
        <div class="mt-3 col-md-6">
          {% if item.iduser > 0 and item.iduser != currentuser.iduser %}
          {{print_checkeliminar()|raw}}
          {% endif %}
        </div>
      </div>
    </form>
