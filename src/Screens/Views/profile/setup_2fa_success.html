{% extends "layout.html" %}
{% set imenu1=-1 %}
{% block content %}
<div class="page-header d-print-none">
  <div class="row g-2 align-items-center">
    <div class="col">
      <div class="page-pretitle">Mi perfil</div>
    </div>
  </div>
</div>
<div class="page-body">
  <div class="row">
    <div class="col-md-6">
      <div class="card mb-3">
        <div class="card-header d-flex align-items-center justify-content-between">
          <h4 class="card-title"><i class="fas fa-check-circle"></i> Autenticación configurada</h4>
        </div>
        <div class="card-body">
          <div class="alert alert-success">
            Tu método principal ({{ primary == 'totp' ? 'autenticador' : 'correo electrónico' }}) se ha configurado correctamente.
          </div>
          <a href="{{ APP_PATH }}myprofile" class="btn btn-primary"><i class="fas fa-user"></i>&nbsp;Volver a mi perfil</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
